name: Release

# Wydanie z tagu v<wersja> (wersja musi zgadzać się z versions.json i install.sh):
#  1. pliki wydania GitHub: brama (linux_amd64), konektor i frpc dla wszystkich platform, SDK, SHA256SUMS
#  2. SDK w GitHub Packages (npm.pkg.github.com) jako @k18k/entrypoint
#  3. SDK do instalacji z gita: npm install github:k18k/entrypoint-ts (repozytorium z gotowym lib/)
#  4. obraz konektora: ghcr.io/k18k/entrypoint-connector
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            gateway/go.sum
            e2e/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@k18k"

      - name: Zgodność wersji
        id: v
        run: |
          version=$(python3 -c 'import json;print(json.load(open("versions.json"))["entrypoint"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          grep -q "ENTRYPOINT_VERSION:-${version}}" scripts/install.sh || { echo "install.sh nie wskazuje ${version}"; exit 1; }
          test "$(node -p 'require("./sdk/node/package.json").version')" = "${version}"
          test -f "docs/release-notes/v${version}.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pliki wydania
        run: make release

      - name: Wydanie GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release-assets/* \
            --title "Entrypoint ${{ steps.v.outputs.version }}" \
            --notes-file "docs/release-notes/v${{ steps.v.outputs.version }}.md"

      - name: SDK w GitHub Packages
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts

      - name: SDK do instalacji z gita (k18k/entrypoint-ts)
        env:
          DEPLOY_KEY: ${{ secrets.ENTRYPOINT_TS_DEPLOY_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/publish-sdk-git.sh

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Obraz konektora
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/connector
          file: docker/connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/k18k/entrypoint-connector:${{ steps.v.outputs.version }}
            ghcr.io/k18k/entrypoint-connector:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.description=Konektor tunelu Entrypoint (entrypoint-connector + frpc)
            org.opencontainers.image.licenses=Apache-2.0
