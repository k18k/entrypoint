name: Release

# Release from a v<version> tag. Bump the version with `npm run version` (changesets), which
# keeps package.json, versions.json, install.sh and the SDK in sync; the notes are that
# version's section of CHANGELOG.md.
#  1. GitHub release files: gateway (linux_amd64), connector and frpc for all platforms, SHA256SUMS
#  2. SDK as @k18k/entrypoint-ts on npm (trusted publishing, provenance) and GitHub Packages
#  3. connector image: ghcr.io/k18k/entrypoint-connector
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            gateway/go.sum
            e2e/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@k18k"

      - name: Version consistency
        id: v
        run: |
          version=$(python3 -c 'import json;print(json.load(open("versions.json"))["entrypoint"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          grep -q "ENTRYPOINT_VERSION:-${version}}" scripts/install.sh || { echo "install.sh does not point to ${version}"; exit 1; }
          test "$(node -p 'require("./package.json").version')" = "${version}"
          test "$(node -p 'require("./sdk/node/package.json").version')" = "${version}"
          awk -v h="## ${version}" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no ${version} section"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Release files
        run: make release

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release-assets/* \
            --title "Entrypoint ${{ steps.v.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: SDK to GitHub Packages
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts --@k18k:registry=https://npm.pkg.github.com

      # Trusted publishing (OIDC) needs no secret. npm only allows setting it up on an existing
      # package, so the very first publish uses an NPM_TOKEN secret, which is deleted afterwards.
      - name: SDK to npm
        working-directory: sdk/node
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"; fi
          npm publish --ignore-scripts --provenance --@k18k:registry=https://registry.npmjs.org

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Connector image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/connector
          file: docker/connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/k18k/entrypoint-connector:${{ steps.v.outputs.version }}
            ghcr.io/k18k/entrypoint-connector:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.description=Entrypoint tunnel connector (entrypoint-connector + frpc)
            org.opencontainers.image.licenses=Apache-2.0
