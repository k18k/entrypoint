name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Also run the experiments (Caddy and frp behavior)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            gateway/go.sum
            e2e/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: gofmt
        run: test -z "$(gofmt -l gateway e2e)" || { gofmt -l gateway e2e; exit 1; }
      - name: go vet and tests
        run: make test
      - name: SDK (typecheck, oxlint, oxfmt, build)
        working-directory: sdk/node
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Panel frontend (typecheck, build)
        working-directory: panel
        run: |
          npm ci --no-audit --no-fund
          npm run build

  e2e:
    name: e2e tests (Docker)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            gateway/go.sum
            e2e/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: make e2e
        run: make e2e SHARDS=3
      - name: make e2e-experiments
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.experiments }}
        run: make e2e-experiments SHARDS=3
      - name: Test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          retention-days: 7
