# Środowisko e2e (sekcja 18 specyfikacji). Uruchamiane przez `make e2e`.
# Obrazy buduje `make e2e-build`. REPO to bezwzględna ścieżka repozytorium; runner widzi ją pod tą samą ścieżką,
# żeby mógł sterować kontenerami przez docker compose.
name: ep-e2e-${SHARD:-0}

x-client: &client
  image: ep-e2e-client
  dns: ["${NET:-10.77.0}.2"]
  cap_add: [NET_ADMIN]
  init: true

services:
  dns:
    image: coredns/coredns:1.14.7
    container_name: ep${SHARD:-0}-dns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ${REPO}/e2e/dns/Corefile:/etc/coredns/Corefile:ro
      - ${REPO}/e2e/.run/${SHARD:-0}/zones:/zones
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.2" }

  acme:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    container_name: ep${SHARD:-0}-acme
    command: ["-config", "/test/config/ep.json", "-dnsserver", "${NET:-10.77.0}.2:53", "-strict"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
      PEBBLE_AUTHZREUSE: "0"
    volumes:
      - ${REPO}/e2e/pebble/pebble-config.json:/test/config/ep.json:ro
    networks:
      epnet:
        ipv4_address: "${NET:-10.77.0}.3"
        aliases: [pebble]

  gateway: &gateway
    image: ep-e2e-gateway
    container_name: ep${SHARD:-0}-gateway
    hostname: gateway
    privileged: true
    cgroup: private
    tmpfs: [/run, /run/lock, /tmp]
    dns: ["${NET:-10.77.0}.2"]
    volumes:
      - ${REPO}/dist:/dist:ro
      - ${REPO}/scripts:/scripts:ro
      - ${REPO}/e2e/pebble:/pebble:ro
      - ${REPO}/e2e/.run/${SHARD:-0}/shared:/shared
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.10" }
      privnet: { ipv4_address: "${PRIV:-10.78.0}.10" }

  # Druga maszyna bramy: restore pod nowym adresem IP przy stałej nazwie bramy.
  gateway2:
    <<: *gateway
    container_name: ep${SHARD:-0}-gateway2
    hostname: gateway2
    profiles: [restore]
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.11" }
      privnet: { ipv4_address: "${PRIV:-10.78.0}.11" }

  upstream:
    image: ep-e2e-upstream
    container_name: ep${SHARD:-0}-upstream
    command: ["testsrv", "-addr", ":8080", "-name", "vpn-upstream"]
    networks:
      # Osiągalny wyłącznie z bramy, jak usługa za VPN.
      privnet: { ipv4_address: "${PRIV:-10.78.0}.20" }

  client-a:
    <<: *client
    container_name: ep${SHARD:-0}-client-a
    hostname: client-a
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.21" }

  client-b:
    <<: *client
    container_name: ep${SHARD:-0}-client-b
    hostname: client-b
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.22" }

  # Macierz SDK: Node 22 i Express 4.
  client-n22:
    <<: *client
    image: ep-e2e-client-node22
    container_name: ep${SHARD:-0}-client-n22
    hostname: client-n22
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.24" }

  attacker:
    <<: *client
    container_name: ep${SHARD:-0}-attacker
    hostname: attacker
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.23" }

  chaos:
    image: ep-e2e-chaos
    profiles: [tools]

  runner:
    image: ep-e2e-runner
    container_name: ep${SHARD:-0}-runner
    dns: ["${NET:-10.77.0}.2"]
    working_dir: ${REPO}/e2e
    environment:
      REPO: ${REPO}
      EP_E2E: "1"
      SHARD: ${SHARD:-0}
      NET: ${NET:-10.77.0}
      PRIV: ${PRIV:-10.78.0}
      EP_SHARD: ${SHARD:-0}
      EP_SHARDS: ${SHARDS:-1}
      EP_EXPERIMENTS: ${EXPERIMENTS:-}
      GOMODCACHE: /cache/mod
      GOCACHE: /cache/build
    volumes:
      - ${REPO}:${REPO}
      - /var/run/docker.sock:/var/run/docker.sock
      - ep-e2e-gocache:/cache
    command: ["sleep", "infinity"]
    networks:
      epnet: { ipv4_address: "${NET:-10.77.0}.30" }

networks:
  epnet:
    ipam:
      config: [{ subnet: "${NET:-10.77.0}.0/24" }]
  privnet:
    ipam:
      config: [{ subnet: "${PRIV:-10.78.0}.0/24" }]

volumes:
  # Wspólna pamięć podręczna Go dla wszystkich kopii (tworzy ją Makefile, nie usuwa e2e-down).
  ep-e2e-gocache:
    external: true
